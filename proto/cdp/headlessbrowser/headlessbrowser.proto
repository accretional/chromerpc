syntax = "proto3";

package cdp.headlessbrowser;

option go_package = "github.com/accretional/chromerpc/proto/cdp/headlessbrowser";

// HeadlessBrowser service — high-level browser automation as sequences of steps.
// Automation sequences can be authored as text proto files and reorganized modularly.

service HeadlessBrowserService {
  // Execute a sequence of automation steps in order.
  rpc RunAutomation(AutomationSequence) returns (AutomationResult);

  // Execute a single automation step and return its result.
  // Useful for orchestrators that need to branch on step results.
  rpc ExecuteStep(AutomationStep) returns (StepResult);
}

// InteractiveSessionService is a bidirectional-streaming interface for stateful,
// interactive browser sessions. The client opens one Session stream, sends steps
// one at a time (reacting to each result before sending the next), and the server
// runs them against a single dedicated Chrome whose state PERSISTS for the life of
// the stream. When the stream closes, the server recycles (kills and relaunches)
// its Chrome child process, so the next client connecting to that instance gets a
// completely fresh browser — providing process-level isolation between tenants.
//
// Intended deployment: a dedicated Cloud Run service with concurrency=1 so each
// instance serves exactly one session at a time.
service InteractiveSessionService {
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
}

// SessionRequest is one message a client sends on the Session stream.
message SessionRequest {
  // Client-chosen correlation id, echoed back on the matching SessionResponse.
  uint64 id = 1;
  oneof command {
    // Run a single automation step against the persistent session.
    AutomationStep step = 2;
    // Explicitly wipe browser state mid-session (recycle Chrome now).
    ResetSession reset = 3;
    // Liveness check.
    Ping ping = 4;
  }
}

// SessionResponse is one message the server sends on the Session stream.
message SessionResponse {
  // Correlation id from the originating SessionRequest (0 for unsolicited events).
  uint64 id = 1;
  oneof event {
    // Sent once when the session is ready to accept commands.
    SessionReady ready = 2;
    // Result of an AutomationStep.
    StepResult result = 3;
    // Reply to a Ping.
    Pong pong = 4;
    // A session-level error (the stream may continue or end after this).
    SessionError error = 5;
  }
}

message ResetSession {}
message Ping {}
message Pong {}

message SessionReady {
  // Opaque id for the session (for logging/correlation).
  string session_id = 1;
}

message SessionError {
  string message = 1;
}

// A complete automation sequence: an ordered list of steps.
message AutomationSequence {
  string name = 1;
  repeated AutomationStep steps = 2;
}

// A single automation step. Each step is one of the supported actions.
message AutomationStep {
  string label = 1;
  oneof action {
    SetViewport set_viewport = 2;
    Navigate navigate = 3;
    Wait wait = 4;
    Screenshot screenshot = 5;
    EvaluateScript evaluate_script = 6;
    Click click = 7;
    TypeText type_text = 8;
    WaitForSelector wait_for_selector = 9;
    Reload reload = 10;
    ScrollTo scroll_to = 11;
    TypeKeyByKey type_key_by_key = 12;
    PressKey press_key = 13;
    FullPageScreenshot full_page_screenshot = 14;
    OpenTab open_tab = 15;
    CloseTab close_tab = 16;
    SwitchTab switch_tab = 17;
    DownloadFile download_file = 18;
    Hover hover = 19;
    PrintToPdf print_to_pdf = 20;
    DispatchTouch touch = 21;
    SetEmulatedMedia set_emulated_media = 22;
  }
}

// Set the browser viewport dimensions.
message SetViewport {
  int32 width = 1;
  int32 height = 2;
  double device_scale_factor = 3;
  bool mobile = 4;
}

// Navigate to a URL.
message Navigate {
  string url = 1;
  // wait_until controls when navigation is considered complete:
  //   "" / "commit"  - return as soon as navigation is committed (default)
  //   "load"         - wait for the page 'load' event
  //   "networkidle"  - wait for 'load', then until network is idle (~500ms with
  //                    no in-flight requests)
  string wait_until = 2;
  // timeout_ms bounds the wait_until wait. Default 30000. On timeout, navigation
  // is treated as successful (best-effort) rather than failing the step.
  int32 timeout_ms = 3;
}

// Wait for a fixed duration.
message Wait {
  int32 milliseconds = 1;
}

// Capture a screenshot and save to a file path on the server.
message Screenshot {
  string output_path = 1;
  // PNG or JPEG.
  string format = 2;
  int32 quality = 3;
  bool full_page = 4;
}

// Evaluate JavaScript in the page context.
message EvaluateScript {
  string expression = 1;
}

// Click at coordinates or a CSS selector.
message Click {
  double x = 1;
  double y = 2;
  string selector = 3;
}

// Type text (simulates keyboard input via insertText).
message TypeText {
  string text = 1;
  string selector = 2;
}

// Wait for a CSS selector to appear in the DOM.
message WaitForSelector {
  string selector = 1;
  int32 timeout_ms = 2;
}

// Reload the current page.
message Reload {
  bool ignore_cache = 1;
}

// Scroll to coordinates.
message ScrollTo {
  double x = 1;
  double y = 2;
}

// Type text key-by-key with realistic delays between keystrokes.
message TypeKeyByKey {
  string text = 1;
  // Delay in milliseconds between each keystroke. Default 50.
  int32 delay_ms = 2;
  // Optional selector to focus before typing.
  string selector = 3;
}

// Press a special key (Enter, Tab, Escape, Backspace, etc.).
message PressKey {
  string key = 1;
}

// Capture a full-page screenshot (resizes viewport to full page height).
message FullPageScreenshot {
  string output_path = 1;
  string format = 2;
  int32 quality = 3;
}

// Open a new browser tab with a URL. Returns target_id in script_result.
message OpenTab {
  string url = 1;
}

// Close a tab by target_id. If empty, closes the current tab.
message CloseTab {
  string target_id = 1;
}

// Switch to a tab by target_id. Attaches a new session.
message SwitchTab {
  string target_id = 1;
}

// Download a file from a URL and save to disk.
message DownloadFile {
  string url = 1;
  string output_path = 2;
}

// Move the mouse pointer over coordinates or a CSS selector (mouseMoved). This
// updates the rendered cursor shape and fires :hover, without pressing.
message Hover {
  double x = 1;
  double y = 2;
  string selector = 3;
}

// Render the current page to a PDF on disk via Page.printToPDF. Used to capture
// paged-media behaviour (page breaks, orphans/widows) that only exists when the
// document is fragmented into pages.
message PrintToPdf {
  string output_path = 1;
  bool print_background = 2;
  bool prefer_css_page_size = 3;
  double paper_width = 4;   // inches; 0 -> Chrome default (8.5)
  double paper_height = 5;  // inches; 0 -> Chrome default (11)
  double scale = 6;         // 0 -> 1.0
}

// Dispatch a touch pan gesture from a start point by (dx, dy) over the given
// selector/coords, used to exercise touch-action. Emits touchStart, a few
// touchMove steps, then touchEnd.
message DispatchTouch {
  double x = 1;
  double y = 2;
  string selector = 3;
  double dx = 4;
  double dy = 5;
}

// Override the page's emulated media type (e.g. "print", "screen") and/or
// features via Emulation.setEmulatedMedia.
message SetEmulatedMedia {
  string media = 1;  // "print" | "screen" | "" to clear
}

// Result of a full automation sequence run.
message AutomationResult {
  bool success = 1;
  repeated StepResult step_results = 2;
  string error = 3;
}

// Result of a single step.
message StepResult {
  string label = 1;
  bool success = 2;
  string error = 3;
  // For screenshot steps, the bytes of the captured image.
  bytes screenshot_data = 4;
  // For evaluate_script steps, the return value.
  string script_result = 5;
}
