# Cloud Build pipeline for chromerpc.
#
# What it does:
#   1. Builds the container image (Go binary + bundled google-chrome-stable).
#   2. Reads the *installed* Chrome version out of the freshly built image and
#      uses it as the image tag, giving a 1:1 image-name <-> Chrome-version
#      correspondence (e.g. .../chromerpc:126.0.6478.126). Rebuilding picks up
#      whatever "stable" Chrome is current, so the service auto-updates while the
#      exact version stays visible in the tag.
#   3. Pushes :<chrome-version> and :latest to Artifact Registry.
#   4. Deploys to Cloud Run (HTTP/2 for gRPC, scale-to-zero, concurrency 1).
#
# Invoke via scripts/deploy-cloudrun.sh (recommended) or directly:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=chromerpc,_SERVICE=chromerpc

substitutions:
  _REGION: us-central1
  _REPO: chromerpc
  _SERVICE: chromerpc
  _MAX_INSTANCES: "10"
  _CONCURRENCY: "8"      # requests per instance; each gets an isolated browser context
  _CPU: "4"
  _MEMORY: 4Gi
  _INVOKER_AUTH: allow   # "allow" => public; anything else => require IAM invoker

options:
  machineType: E2_HIGHCPU_8        # faster Chrome download + Go build
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build the image with a throwaway tag.
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "chromerpc:build", "."]

  # 2. Derive the Chrome version, tag, and push.
  - id: tag-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/chromerpc"
        VER="$(docker run --rm --entrypoint google-chrome-stable chromerpc:build --version \
                | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -n1)"
        if [ -z "$$VER" ]; then echo "could not determine Chrome version" >&2; exit 1; fi
        echo "Chrome version: $$VER"
        echo "$$VER" > /workspace/chrome_version.txt
        docker tag chromerpc:build "$${IMAGE}:$${VER}"
        docker tag chromerpc:build "$${IMAGE}:latest"
        docker push "$${IMAGE}:$${VER}"
        docker push "$${IMAGE}:latest"

  # 3. Deploy the exact version-tagged image to Cloud Run.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/chromerpc"
        VER="$(cat /workspace/chrome_version.txt)"
        if [ "${_INVOKER_AUTH}" = "allow" ]; then AUTH="--allow-unauthenticated"; else AUTH="--no-allow-unauthenticated"; fi
        gcloud run deploy "${_SERVICE}" \
          --image "$${IMAGE}:$${VER}" \
          --region "${_REGION}" \
          --platform managed \
          --port 8080 \
          --use-http2 \
          --concurrency "${_CONCURRENCY}" \
          --min-instances 0 \
          --max-instances "${_MAX_INSTANCES}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --cpu-boost \
          --timeout 300 \
          $$AUTH \
          --labels "chrome-version=$${VER//./-}"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/chromerpc"
